check-python:
  image: python:3.13-slim@sha256:7ce4b6dfe35e55397b7cda544f8a13f191b7ae28dc5aad71fe664dbc9bc2623f
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git shellcheck util-linux
    - pip install --disable-pip-version-check ruff==0.15.5 mypy==1.19.1 jinja2==3.1.6 markupsafe==3.0.3 pyyaml==6.0.2
  script:
    - ruff format --check .
    - ruff check .
    - mypy .
    - shellcheck setup.sh
    - bash -n setup.sh

check-nix:
  image: nixos/nix:2.35.2@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c
  script:
    - nix --extra-experimental-features 'nix-command flakes' flake check --print-build-logs
