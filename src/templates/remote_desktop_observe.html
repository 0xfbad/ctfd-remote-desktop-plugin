<!DOCTYPE html>
<html data-bs-theme="dark" data-default-theme="dark">
<head>
    {% from "core/macros/page-title.html" import render_page_title with context %}
    <title>{{ render_page_title(target_name ~ " - Remote Desktop") }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="{{ Configs.ctf_small_icon }}" type="image/x-icon">
    {{ Assets.css("assets/scss/main.scss", theme="core") }}
    {{ Assets.js("assets/js/color_mode_switcher.js", theme="core", type=None) }}
</head>
<body class="overflow-hidden">
<p id="view-status" class="position-fixed top-0 start-0 p-2 bg-body" role="status">Connecting…</p>
<div id="desktop-view" role="main" aria-label="{{ target_name }}'s desktop" style="height: 100dvh;"></div>
<script type="module">
    import RFB from {{ rfb_module | tojson }};

    const status = document.getElementById('view-status');
    const socket = new URL({{ websocket_path | tojson }}, window.location.href);
    socket.protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

    const rfb = new RFB(document.getElementById('desktop-view'), socket.href, {
        credentials: { password: {{ password | tojson }} },
    });
    rfb.viewOnly = true;
    rfb.scaleViewport = true;

    rfb.addEventListener('connect', () => {
        status.hidden = true;
    });
    rfb.addEventListener('disconnect', () => {
        status.hidden = false;
        status.textContent = 'Disconnected';
    });
    rfb.addEventListener('securityfailure', () => {
        status.hidden = false;
        status.textContent = 'Authentication failed';
    });
</script>
</body>
</html>
